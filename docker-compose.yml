version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wayv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wayv
      POSTGRES_PASSWORD: wayv_password
      POSTGRES_DB: wayv_clipping
    ports:
      - "5432:5432"
    volumes:
      - wayv_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: wayv_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  wayv_postgres_data:
